<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAGE-CHAN</title>
  <link rel="stylesheet" href="kage-chan.css">
</head>
<body>
  <div id="companion-wrapper">
    <!-- Character Avatar Mount (Transparent Floating Desktop Companion) -->
    <div id="avatar-mount"></div>

    <!-- Speech Balloon (Strictly disabled: no popping questions) -->
    <div class="kc-speech-balloon" id="speech-balloon" style="display: none !important;">
      <span id="speech-text"></span>
    </div>

    <!-- Radial Interaction Menu (Zero Emojis, Sleek SVG Icons) -->
    <div class="kc-interaction-menu" id="interaction-menu">
      <div class="menu-item menu-pet" data-action="pet" data-tooltip="Headpat Kage-chan">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="menu-item menu-play" data-action="play" data-tooltip="Play with Kage-chan">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      </div>
      <div class="menu-item menu-sleep" data-action="sleep" data-tooltip="Rest & Sleep">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.6-11.6A10 10 0 0 0 12.3 2z"/></svg>
      </div>
      <div class="menu-item menu-settings" data-action="settings" data-tooltip="Open Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </div>
      <div class="menu-item menu-close" data-action="close" data-tooltip="Close Menu">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
      <div class="menu-tooltip" id="menu-tooltip"></div>
    </div>
  </div>

  <script src="../../shared/audio/audioEngine.js"></script>
  <script src="kage-chan-avatar.js"></script>
  <script src="kage-chan.js"></script>
</body>
</html>
